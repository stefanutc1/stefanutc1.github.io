name: CI/CD — Build & Deploy Next.js 15 to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci-build:
    name: "CI — TypeScript, Quality Gates & Static Export"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build Next.js 15 Static Export (./out)
        run: npm run build

      - name: Verify Static Export Integrity
        run: |
          touch out/.nojekyll
          test -f out/index.html || { echo "Error: out/index.html missing"; exit 1; }
          test -f out/404.html || { echo "Error: out/404.html missing"; exit 1; }
          test -d out/_next || { echo "Error: out/_next directory missing"; exit 1; }
          echo "Static export verified successfully."

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  cd-deploy:
    name: "CD — Deploy to GitHub Pages (stefanutc1.github.io)"
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: ci-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
